<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR MVP - Model-Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: Arial, sans-serif; }
    
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: #111;
    }
    
    #info {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 10;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: none;
      max-width: 90%;
    }
    
    #status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      background: #ff6b6b;
    }
    
    #status-dot.active {
      background: #51cf66;
    }
  </style>
</head>
<body>
  
  <model-viewer
    id="mv"
    src="tiny_planet_friends_3d-mug-2923.glb"
    alt="Modelo 3D"
    camera-controls
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    min-camera-orbit="auto auto 50%"
    max-camera-orbit="auto auto 200%"
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    loading="eager"
    interaction-prompt="auto"
    style="width:100%; height:100vh;">
  </model-viewer>
  
  <div id="info">
    <span id="status-dot"></span>
    <span id="status-text">Iniciando...</span>
  </div>

  <script>
    (function() {
      const mv = document.getElementById('mv');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');

      function setStatus(text, isReady = false) {
        statusText.textContent = text;
        if (isReady) {
          statusDot.classList.add('active');
        } else {
          statusDot.classList.remove('active');
        }
      }

      // Cuando el modelo cargue
      mv.addEventListener('load', () => {
        setStatus('✅ Modelo listo. Toca el botón AR 🥽', true);
        console.log('✅ Modelo cargado');
      });

      // Cuando entre en modo AR (WebXR)
      mv.addEventListener('ar-ready', () => {
        setStatus('🔮 AR activo! Busca el suelo', true);
        console.log('✅ AR activo');
      });

      // Cuando sale del modo AR
      mv.addEventListener('ar-unload', () => {
        setStatus('👋 AR desactivado', false);
        console.log('❌ AR desactivado');
      });

      // Error de AR
      mv.addEventListener('error', (e) => {
        console.warn('⚠️ Error en model-viewer:', e.detail);
        setStatus('⚠️ AR no disponible. Usa vista 3D.', false);
      });

      // Fallback: si el botón AR no aparece, mostrar mensaje
      setTimeout(() => {
        const arButton = mv.shadowRoot?.querySelector('.ar-button');
        if (!arButton || arButton.style.display === 'none') {
          setStatus('📱 Presiona el botón 🥽 para intentar AR', false);
        }
      }, 5000);

      // Inicializar estado
      setStatus('🔄 Cargando modelo...', false);

    })();
  </script>
</body>
</html>
